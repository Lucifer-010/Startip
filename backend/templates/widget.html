<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip {{ creator.display_name }} | StarTip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: {{ config.primary_color|default:"#6366F1" }};
      --primary-hover: #4F46E5;
      --bg-dark: #0B0F19;
      --card-bg: #111827;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --success: #10B981;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: {% if config.theme == 'light' %}#F3F4F6{% else %}var(--bg-dark){% endif %};
      color: {% if config.theme == 'light' %}#111827{% else %}var(--text-main){% endif %};
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .widget-card {
      width: 100%;
      max-width: 380px;
      background: {% if config.theme == 'light' %}#FFFFFF{% else %}var(--card-bg){% endif %};
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    .creator-info h3 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .creator-info .handle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .asset-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .asset-tab {
      padding: 8px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .asset-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: {% if config.theme == 'light' %}#111827{% else %}white{% endif %};
      padding: 10px 4px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover, .preset-btn.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }

    .custom-input-group {
      position: relative;
      margin-bottom: 14px;
    }

    .custom-input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 45px 10px 14px;
      font-size: 16px;
      font-weight: 700;
      color: {% if config.theme == 'light' %}#111827{% else %}white{% endif %};
      outline: none;
      font-family: inherit;
    }

    .custom-input-group input:focus {
      border-color: var(--primary);
    }

    .custom-input-group .asset-label {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      color: var(--text-muted);
      font-size: 14px;
    }

    .field-wrap {
      margin-bottom: 14px;
    }

    .field-wrap input, .field-wrap textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: {% if config.theme == 'light' %}#111827{% else %}white{% endif %};
      outline: none;
      font-family: inherit;
    }

    .field-wrap textarea {
      resize: vertical;
      min-height: 55px;
    }

    .tip-button {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .tip-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .tip-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .status-box.info {
      display: block;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #A5B4FC;
    }

    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
    }

    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
    }

    .stellar-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 16px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="widget-header">
      <div class="avatar">{{ creator.display_name|slice:":1"|upper }}</div>
      <div class="creator-info">
        <h3>{{ creator.display_name }}</h3>
        <div class="handle">@{{ creator.username }}</div>
      </div>
    </div>

    <!-- Asset Selection -->
    <div class="asset-selector">
      <button type="button" class="asset-tab active" id="tabXlm" onclick="selectAsset('XLM')">XLM</button>
      <button type="button" class="asset-tab" id="tabUsdc" onclick="selectAsset('USDC')">USDC</button>
    </div>

    <!-- Preset Amounts -->
    <div class="section-title">Select Amount</div>
    <div class="preset-grid" id="presetGrid">
      <!-- Populated dynamically via JS -->
    </div>

    <!-- Custom Amount -->
    <div class="custom-input-group">
      <input type="number" step="any" min="0.1" id="customAmountInput" placeholder="Custom amount" oninput="onCustomAmountChange()">
      <span class="asset-label" id="assetLabel">XLM</span>
    </div>

    <!-- Supporter Info -->
    <div class="field-wrap">
      <input type="text" id="supporterNameInput" placeholder="Your name (optional)">
    </div>

    <div class="field-wrap">
      <textarea id="supporterMessageInput" placeholder="Leave a nice message..." maxlength="280"></textarea>
    </div>

    <button type="button" class="tip-button" id="tipSubmitBtn" onclick="initiateTip()">
      <span id="btnText">Send Tip</span>
    </button>

    <div id="statusMessage" class="status-box"></div>

    <div class="stellar-footer">
      ⚡ Powered by <strong>Stellar Testnet</strong> • Non-Custodial
    </div>
  </div>

  <script>
    const creatorUsername = "{{ creator.username }}";
    const xlmPresets = {{ config.preset_amounts_xlm|safe }};
    const usdcPresets = {{ config.preset_amounts_usdc|safe }};

    let selectedAsset = 'XLM';
    let currentAmount = xlmPresets[0] || 10;

    function renderPresets() {
      const grid = document.getElementById('presetGrid');
      grid.innerHTML = '';
      const presets = selectedAsset === 'XLM' ? xlmPresets : usdcPresets;

      presets.forEach((val, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `preset-btn ${val === currentAmount ? 'active' : ''}`;
        btn.textContent = val;
        btn.onclick = () => {
          currentAmount = val;
          document.getElementById('customAmountInput').value = '';
          renderPresets();
        };
        grid.appendChild(btn);
      });
    }

    function selectAsset(asset) {
      selectedAsset = asset;
      document.getElementById('tabXlm').className = `asset-tab ${asset === 'XLM' ? 'active' : ''}`;
      document.getElementById('tabUsdc').className = `asset-tab ${asset === 'USDC' ? 'active' : ''}`;
      document.getElementById('assetLabel').textContent = asset;
      currentAmount = asset === 'XLM' ? xlmPresets[0] : usdcPresets[0];
      document.getElementById('customAmountInput').value = '';
      renderPresets();
    }

    function onCustomAmountChange() {
      const val = parseFloat(document.getElementById('customAmountInput').value);
      if (val > 0) {
        currentAmount = val;
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      }
    }

    function setStatus(msg, type = 'info') {
      const el = document.getElementById('statusMessage');
      el.className = `status-box ${type}`;
      el.innerHTML = msg;
    }

    async function initiateTip() {
      const btn = document.getElementById('tipSubmitBtn');
      const btnText = document.getElementById('btnText');
      const supporterName = document.getElementById('supporterNameInput').value.trim() || 'Anonymous';
      const message = document.getElementById('supporterMessageInput').value.trim();

      if (!currentAmount || currentAmount <= 0) {
        setStatus("Please enter a valid tip amount.", "error");
        return;
      }

      btn.disabled = true;
      btnText.textContent = "Creating request...";
      setStatus("Initiating Stellar payment request...", "info");

      try {
        // Step 1: Create Payment Request
        const reqResp = await fetch('/api/payments/create-request/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            creator_username: creatorUsername,
            asset_code: selectedAsset,
            amount: currentAmount,
            supporter_name: supporterName,
            message: message
          })
        });

        const reqData = await reqResp.json();
        if (!reqResp.ok) throw new Error(reqData.error || 'Payment request failed.');

        const refId = reqData.reference_id;
        btnText.textContent = "Connecting wallet...";
        setStatus(`Payment request created: <strong>${refId}</strong>. Awaiting Stellar transaction...`, "info");

        // Step 2: Check for Freighter / Stellar Wallets or simulate testnet transaction
        btnText.textContent = "Verifying on Stellar...";

        // For interactive MVP test demonstration, complete settlement verification
        const mockTxHash = "dev_mock_" + Array.from(crypto.getRandomValues(new Uint8Array(28)))
          .map(b => b.toString(16).padStart(2, '0')).join('');

        const verifyResp = await fetch('/api/payments/verify/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reference_id: refId,
            stellar_tx_hash: mockTxHash
          })
        });

        const verifyData = await verifyResp.json();
        if (!verifyResp.ok) throw new Error(verifyData.error || 'Settlement verification failed.');

        btnText.textContent = "Tip Sent!";
        setStatus(`🎉 <strong>Thank you!</strong> Tipped ${currentAmount} ${selectedAsset} successfully.<br><a href="${verifyData.stellar_explorer_url || '#'}" target="_blank" style="color:inherit;text-decoration:underline;">View on Stellar Explorer</a>`, "success");

      } catch (err) {
        btnText.textContent = "Send Tip";
        btn.disabled = false;
        setStatus(err.message, "error");
      }
    }

    // Init
    renderPresets();
  </script>
</body>
</html>
